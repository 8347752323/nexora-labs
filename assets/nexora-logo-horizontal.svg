<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgHorizontalGlow" cx="20%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="60%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="cyanGradH" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <linearGradient id="purpleGradH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="diagonalGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="35%" stop-color="#60A5FA" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="labsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <filter id="neonGlowH" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="500" rx="24" fill="url(#bgHorizontalGlow)" />

  <!-- Background subtle ambient lighting -->
  <circle cx="260" cy="250" r="180" fill="#00f5ff" fill-opacity="0.08" filter="url(#neonGlowH)" />
  <circle cx="380" cy="250" r="180" fill="#a855f7" fill-opacity="0.07" filter="url(#neonGlowH)" />

  <!-- ==================== LEFT ICON / LOGOMARK (Scalable 0.58 factor, centered around x=260, y=250) ==================== -->
  <g transform="translate(-10, 0)">
    <!-- Circuit pathways branching around mark -->
    <path d="M 80 200 L 140 200 L 170 230 L 190 230" fill="none" stroke="#00f5ff" stroke-width="1.6" stroke-opacity="0.5"/>
    <circle cx="80" cy="200" r="3" fill="#00f5ff" fill-opacity="0.7"/>

    <path d="M 100 320 L 150 320 L 180 290 L 190 290" fill="none" stroke="#00f5ff" stroke-width="1.6" stroke-opacity="0.5" stroke-dasharray="3 5"/>
    <circle cx="100" cy="320" r="3" fill="#00f5ff" fill-opacity="0.7"/>

    <path d="M 430 180 L 370 180 L 340 210 L 320 210" fill="none" stroke="#c084fc" stroke-width="1.6" stroke-opacity="0.5"/>
    <circle cx="430" cy="180" r="3" fill="#c084fc" fill-opacity="0.7"/>

    <path d="M 420 310 L 370 310 L 340 280 L 320 280" fill="none" stroke="#d946ef" stroke-width="1.6" stroke-opacity="0.5" stroke-dasharray="3 5"/>
    <circle cx="420" cy="310" r="3" fill="#d946ef" fill-opacity="0.7"/>

    <!-- Geometric N Glow Underlay -->
    <g opacity="0.6" filter="url(#neonGlowH)">
      <line x1="190" y1="110" x2="190" y2="390" stroke="url(#cyanGradH)" stroke-width="18" stroke-linecap="round"/>
      <line x1="190" y1="120" x2="330" y2="380" stroke="url(#diagonalGradH)" stroke-width="17" stroke-linecap="round"/>
      <line x1="330" y1="110" x2="330" y2="390" stroke="url(#purpleGradH)" stroke-width="18" stroke-linecap="round"/>
    </g>

    <!-- Side Guide Rails -->
    <line x1="174" y1="150" x2="174" y2="350" stroke="#00f5ff" stroke-width="2.2" stroke-opacity="0.6" stroke-linecap="round"/>
    <line x1="346" y1="150" x2="346" y2="350" stroke="#c084fc" stroke-width="2.2" stroke-opacity="0.6" stroke-linecap="round"/>

    <!-- Core Geometric Beams of the "N" -->
    <line x1="190" y1="110" x2="190" y2="390" stroke="url(#cyanGradH)" stroke-width="11" stroke-linecap="round"/>
    <line x1="190" y1="115" x2="330" y2="385" stroke="url(#diagonalGradH)" stroke-width="11" stroke-linecap="round"/>
    <line x1="330" y1="110" x2="330" y2="390" stroke="url(#purpleGradH)" stroke-width="11" stroke-linecap="round"/>

    <!-- Inner Vector Light Filaments -->
    <line x1="190" y1="130" x2="190" y2="370" stroke="#ffffff" stroke-width="2.8" stroke-opacity="0.9" stroke-linecap="round"/>
    <line x1="196" y1="130" x2="324" y2="370" stroke="#ffffff" stroke-width="2.8" stroke-opacity="0.95" stroke-linecap="round"/>
    <line x1="330" y1="130" x2="330" y2="370" stroke="#ffffff" stroke-width="2.8" stroke-opacity="0.9" stroke-linecap="round"/>

    <!-- Neural Network Nodes -->
    <!-- Node Top-Left -->
    <circle cx="190" cy="110" r="14" fill="#00f5ff" fill-opacity="0.25"/>
    <circle cx="190" cy="110" r="9" fill="#0284c7"/>
    <circle cx="190" cy="110" r="5" fill="#00f5ff"/>
    <circle cx="190" cy="110" r="2.2" fill="#ffffff"/>

    <!-- Node Mid-Left -->
    <circle cx="190" cy="250" r="10" fill="#00f5ff" fill-opacity="0.2"/>
    <circle cx="190" cy="250" r="6" fill="#0284c7"/>
    <circle cx="190" cy="250" r="3.2" fill="#38bdf8"/>
    <circle cx="190" cy="250" r="1.5" fill="#ffffff"/>

    <!-- Node Bottom-Left -->
    <circle cx="190" cy="390" r="14" fill="#38bdf8" fill-opacity="0.25"/>
    <circle cx="190" cy="390" r="9" fill="#0284c7"/>
    <circle cx="190" cy="390" r="5" fill="#00f5ff"/>
    <circle cx="190" cy="390" r="2.2" fill="#ffffff"/>

    <!-- Diagonal Inflexion 1 -->
    <circle cx="237" cy="204" r="8" fill="#60a5fa" fill-opacity="0.25"/>
    <circle cx="237" cy="204" r="5" fill="#2563eb"/>
    <circle cx="237" cy="204" r="2.8" fill="#93c5fd"/>

    <!-- Center Nexus -->
    <circle cx="260" cy="250" r="17" fill="#8b5cf6" fill-opacity="0.35" filter="url(#subtleGlow)"/>
    <circle cx="260" cy="250" r="10" fill="#6d28d9"/>
    <circle cx="260" cy="250" r="5.5" fill="#a855f7"/>
    <circle cx="260" cy="250" r="2.4" fill="#ffffff"/>
    <circle cx="260" cy="250" r="26" fill="none" stroke="#00f5ff" stroke-width="0.9" stroke-opacity="0.6" stroke-dasharray="4 3"/>

    <!-- Diagonal Inflexion 2 -->
    <circle cx="283" cy="296" r="8" fill="#c084fc" fill-opacity="0.25"/>
    <circle cx="283" cy="296" r="5" fill="#7c3aed"/>
    <circle cx="283" cy="296" r="2.8" fill="#e9d5ff"/>

    <!-- Node Top-Right -->
    <circle cx="330" cy="110" r="14" fill="#d946ef" fill-opacity="0.25"/>
    <circle cx="330" cy="110" r="9" fill="#9333ea"/>
    <circle cx="330" cy="110" r="5" fill="#c084fc"/>
    <circle cx="330" cy="110" r="2.2" fill="#ffffff"/>

    <!-- Node Mid-Right -->
    <circle cx="330" cy="250" r="10" fill="#a855f7" fill-opacity="0.2"/>
    <circle cx="330" cy="250" r="6" fill="#7e22ce"/>
    <circle cx="330" cy="250" r="3.2" fill="#c084fc"/>
    <circle cx="330" cy="250" r="1.5" fill="#ffffff"/>

    <!-- Node Bottom-Right -->
    <circle cx="330" cy="390" r="14" fill="#f43f5e" fill-opacity="0.25"/>
    <circle cx="330" cy="390" r="9" fill="#c026d3"/>
    <circle cx="330" cy="390" r="5" fill="#f472b6"/>
    <circle cx="330" cy="390" r="2.2" fill="#ffffff"/>
  </g>

  <!-- ==================== VERTICAL DIVIDER ==================== -->
  <line x1="480" y1="120" x2="480" y2="380" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="480" cy="250" r="3" fill="#00f5ff" fill-opacity="0.7"/>

  <!-- ==================== TYPOGRAPHIC WORDMARK ==================== -->
  <g transform="translate(540, 0)">
    <!-- "NEXORA" Primary Brand Title -->
    <text x="0" y="245" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
          font-size="110" 
          font-weight="800" 
          letter-spacing="9" 
          fill="url(#textGrad)">
      NEXORA
    </text>

    <!-- "LABS" Tech Badge / Subtitle -->
    <text x="6" y="325" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
          font-size="34" 
          font-weight="600" 
          letter-spacing="16" 
          fill="url(#labsGrad)">
      LABS
    </text>

    <!-- Tagline: Neural Intelligence & Future Systems -->
    <text x="210" y="325" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
          font-size="17" 
          font-weight="400" 
          letter-spacing="5" 
          fill="#94a3b8" 
          opacity="0.85">
      // ARTIFICIAL INTELLIGENCE RESEARCH
    </text>

    <!-- Minimalist Status Dot / Active System Ping -->
    <circle cx="890" cy="318" r="4" fill="#00f5ff" filter="url(#subtleGlow)"/>
  </g>
</svg>

