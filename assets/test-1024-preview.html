
    <!DOCTYPE html>
    <html class="dark">
    <head>
      <script src="https://cdn.tailwindcss.com"></script>
      <style>
        body { background: #05070d; color: white; font-family: system-ui; padding: 40px; }
      </style>
    </head>
    <body class="space-y-12">
      <h1 class="text-2xl font-bold">New 1024-Extracted Logo Visual Verification</h1>

      <!-- Dark Mode Navbar Test -->
      <div class="space-y-3">
        <span class="text-xs font-mono text-cyan-400">Dark Mode Navbar Header (Height: 46px)</span>
        <header class="h-24 bg-[#05070d] border border-slate-800 rounded-2xl px-8 flex items-center justify-between">
          <a href="/" class="flex items-center gap-2 group">
            <img src="/assets/nexora-logo.png" alt="Nexora" class="h-11 md:h-12 w-auto object-contain">
            <span class="font-bold text-xs md:text-sm tracking-widest bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">LABS</span>
          </a>
          <div class="flex items-center gap-6 text-sm text-slate-300">
            <span>Services</span>
            <span>Resources</span>
            <span>Portfolio</span>
            <span>About Us</span>
          </div>
        </header>
      </div>

      <!-- Light Mode Navbar Test -->
      <div class="space-y-3">
        <span class="text-xs font-mono text-purple-400">Light Mode Navbar Header (Height: 46px)</span>
        <header class="h-24 bg-white border border-slate-200 rounded-2xl px-8 flex items-center justify-between">
          <a href="/" class="flex items-center gap-2 group">
            <img src="/assets/nexora-logo-light.png" alt="Nexora" class="h-11 md:h-12 w-auto object-contain">
            <span class="font-bold text-xs md:text-sm tracking-widest bg-gradient-to-r from-cyan-500 to-purple-600 bg-clip-text text-transparent">LABS</span>
          </a>
          <div class="flex items-center gap-6 text-sm text-slate-700">
            <span>Services</span>
            <span>Resources</span>
            <span>Portfolio</span>
            <span>About Us</span>
          </div>
        </header>
      </div>

      <!-- Standalone Mark Test (Favicon / Modal / Chatbot) -->
      <div class="space-y-3">
        <span class="text-xs font-mono text-emerald-400">Standalone Mark (Various UI sizes: 24px, 40px, 64px, 128px)</span>
        <div class="flex items-center gap-8 p-6 bg-slate-900 border border-slate-800 rounded-2xl">
          <div class="flex flex-col items-center gap-2">
            <img src="/assets/nexora-mark.png" class="w-6 h-6 object-contain">
            <span class="text-[10px] text-slate-500">24px</span>
          </div>
          <div class="flex flex-col items-center gap-2">
            <img src="/assets/nexora-mark.png" class="w-10 h-10 object-contain">
            <span class="text-[10px] text-slate-500">40px</span>
          </div>
          <div class="flex flex-col items-center gap-2">
            <img src="/assets/nexora-mark.png" class="w-16 h-16 object-contain">
            <span class="text-[10px] text-slate-500">64px</span>
          </div>
          <div class="flex flex-col items-center gap-2">
            <img src="/assets/nexora-mark.png" class="w-32 h-32 object-contain">
            <span class="text-[10px] text-slate-500">128px</span>
          </div>
        </div>
      </div>
    </body>
    </html>
